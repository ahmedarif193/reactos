name: Build
on: [push, pull_request]

jobs:
  build-linux:
    strategy:
      matrix:
        compiler: [clang]
        arch: [i386, amd64]
        config: [Debug, Release]
        dllver: ['0x502', '0x600']
        exclude:
          - dllver: 0x600
            config: Release
        include:
          - compiler: gcc
            arch: amd64
            config: Debug
            dllver: '0x502'
          - compiler: gcc
            arch: amd64
            config: Release
            dllver: '0x502'
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ahmedarif193/winget-rosbe/main/rosbe-linux-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v4
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Set up cache for ccache
      uses: actions/cache@v4
      with:
        path: ccache
        key: ccache-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        restore-keys: |
          ccache-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Configure
      id: configure
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        FLAGS=""
        [ "${{matrix.compiler}}" = "clang" ] && FLAGS="$FLAGS --clang"
        [ "${{matrix.config}}" = "Release" ] && FLAGS="$FLAGS -r"
        ./configure.sh $FLAGS -a ${{matrix.arch}} \
          -DDLL_EXPORT_VERSION=${{matrix.dllver}} \
          -DENABLE_CCACHE=1 \
          -DENABLE_ROSTESTS=1 \
          -DENABLE_ROSAPPS=1
        ENV_NAME=$([ "${{matrix.compiler}}" = "clang" ] && echo Clang || echo GCC)
        CFG_LOWER=$(echo "${{matrix.config}}" | tr '[:upper:]' '[:lower:]')
        echo "outdir=output-$ENV_NAME-${{matrix.arch}}-$CFG_LOWER" >> "$GITHUB_OUTPUT"

    - name: Build
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} -k0

    - name: Generate ISOs
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} bootcd livecd

    - name: Print ccache statistics
      run: ccache -s

    - name: Upload ISOs
      uses: actions/upload-artifact@v5
      with:
        name: reactos-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        path: |
          ${{steps.configure.outputs.outdir}}/bootcd.iso
          ${{steps.configure.outputs.outdir}}/livecd.iso
