name: Build
on: [push, pull_request]

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - compiler: gcc
            arch: i386
            config: Debug
            ntver: '0x600'
          - compiler: gcc
            arch: i386
            config: Release
            ntver: '0x600'
          - compiler: gcc
            arch: amd64
            config: Debug
            ntver: '0x600'
          - compiler: gcc
            arch: amd64
            config: Release
            ntver: '0x600'
          - compiler: gcc
            arch: amd64
            config: Debug
            ntver: '0x601'
          - compiler: gcc
            arch: amd64
            config: Release
            ntver: '0x601'
          - compiler: clang
            arch: amd64
            config: Debug
            ntver: '0x601'
          - compiler: clang
            arch: amd64
            config: Release
            ntver: '0x601'
          - compiler: clang
            arch: arm64
            config: Debug
            ntver: '0xA00'
          - compiler: clang
            arch: arm64
            config: Release
            ntver: '0xA00'
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - name: Source checkout
      uses: actions/checkout@v6

    - name: Checkout KDB disassembler dependencies
      if: ${{ matrix.config == 'Debug' && (matrix.arch == 'i386' || matrix.arch == 'amd64') }}
      run: |
        git submodule update --init --depth 1 submodules/fex-arm64ec
        git -C submodules/fex-arm64ec submodule update --init --depth 1 External/zydis
        git -C submodules/fex-arm64ec/External/zydis submodule update --init --depth 1 dependencies/zycore

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ahmedarif193/winget-rosbe/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Set up cache for ccache
      uses: actions/cache@v5
      with:
        path: ccache
        key: ccache-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.ntver}}-${{github.sha}}
        restore-keys: |
          ccache-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.ntver}}-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Configure
      id: configure
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        FLAGS=""
        [ "${{matrix.compiler}}" = "clang" ] && FLAGS="$FLAGS --clang"
        [ "${{matrix.compiler}}" = "gcc" ] && FLAGS="$FLAGS --gcc"
        [ "${{matrix.config}}" = "Release" ] && FLAGS="$FLAGS -r"
        ./configure.sh $FLAGS -a ${{matrix.arch}} \
          -DREACTOS_TARGET_NT=${{matrix.ntver}} \
          -DENABLE_CCACHE=1
        ENV_NAME=$([ "${{matrix.compiler}}" = "clang" ] && echo Clang || echo GCC)
        CFG_LOWER=$(echo "${{matrix.config}}" | tr '[:upper:]' '[:lower:]')
        echo "outdir=output-$ENV_NAME-${{matrix.arch}}-$CFG_LOWER" >> "$GITHUB_OUTPUT"

    - name: Build ISOs
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} bootcd livecd -k0

    - name: Print ccache statistics
      run: ccache -s

    - name: Upload ISOs
      uses: actions/upload-artifact@v7
      with:
        name: reactos-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-target${{matrix.ntver}}-${{github.sha}}
        path: |
          ${{steps.configure.outputs.outdir}}/bootcd.iso
          ${{steps.configure.outputs.outdir}}/livecd.iso
