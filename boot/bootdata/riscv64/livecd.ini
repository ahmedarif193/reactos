[FREELOADER]
DefaultOS=ReactOS
TimeOut=10

[Display]
TitleText=ReactOS RISC-V Core
MinimalUI=Yes

[Operating Systems]
ReactOS="ReactOS (RISC-V Core)"

[ReactOS]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/KERNEL=ntkrnlmp.exe /HAL=hal.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH= /RDRAMSIZE=64M /LOADSYMBOLS
