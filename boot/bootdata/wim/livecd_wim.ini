[FREELOADER]
DefaultOS=LiveCD_Wim_Debug
TimeOut=1

[Display]
TitleText=ReactOS LiveCD (boot.wim)
MinimalUI=Yes

[Operating Systems]
LiveCD_Wim="LiveCD (boot.wim)"
LiveCD_Wim_Debug="LiveCD (boot.wim + Debug)"
LiveCD_Wim_Aacpi="LiveCD ACPI APIC (boot.wim + Debug)"
LiveCD_Wim_Macpi="LiveCD ACPI SMP (boot.wim + Debug)"

[LiveCD_Wim]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH=boot.wim /RDRAMSIZE=384M

[LiveCD_Wim_Debug]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH=boot.wim /RDRAMSIZE=384M

[LiveCD_Wim_Aacpi]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/HAL=halaacpi.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH=boot.wim /RDRAMSIZE=384M

[LiveCD_Wim_Macpi]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/HAL=halmacpi.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH=boot.wim /RDRAMSIZE=384M
