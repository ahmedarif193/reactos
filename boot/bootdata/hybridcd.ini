[FREELOADER]
DefaultOS=Setup
TimeOut=5

[Display]
TitleText=ReactOS Hybrid-CD
MinimalUI=Yes

[Operating Systems]
Setup="Setup"
Setup_Debug="Setup (Debug)"
Setup_Screen="Setup (Screen)"
LiveCD="LiveCD"
LiveCD_Debug="LiveCD (Debug)"
LiveCD_RamFs_Debug="RamFS (Debug)"
LiveCD_Screen="LiveCD (Screen)"
LiveCD_LogFile="LiveCD (Log file)"

[Setup]
BootType=ReactOSSetup
SystemPath=\bootcd

[Setup_Debug]
BootType=ReactOSSetup
SystemPath=\bootcd
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=ReactOSSetup
SystemPath=\bootcd
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[LiveCD]
BootType=Windows2003
SystemPath=\livecd\reactos
Options=/MININT

[LiveCD_Debug]
BootType=Windows2003
SystemPath=\livecd\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /MININT

[LiveCD_RamFs_Debug]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /MININT /RDRAMSIZE=1024M 

[LiveCD_Screen]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /MININT /RDRAMSIZE=1024M

[LiveCD_LogFile]
BootType=Windows2003
SystemPath=\livecd\reactos
Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /MININT
