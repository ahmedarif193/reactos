[FREELOADER]
DefaultOS=LiveIMG_RamFs_Debug
TimeOut=3

[Display]
TitleText=ReactOS Live Image
MinimalUI=Yes

[Operating Systems]
LiveIMG="LiveIMG"
LiveIMG_Debug="LiveIMG (Debug)"
LiveIMG_RamFs="LiveIMG RamFS"
LiveIMG_RamFs_Debug="LiveIMG RamFS (Debug)"
LiveIMG_Macpi="LiveIMG ACPI SMP (Debug)"
LiveIMG_Aacpi="LiveIMG ACPI APIC (Debug)"
LiveIMG_VBoxDebug="LiveIMG (VBox Debug)"
LiveIMG_Screen="LiveIMG (Screen)"
LiveIMG_LogFile="LiveIMG (Log file)"

[LiveIMG]
BootType=Windows2003
SystemPath=\\reactos
Options=/FASTDETECT /MININT

[LiveIMG_Debug]
BootType=Windows2003
SystemPath=\\reactos
Options=/DEBUG DBGCHANNEL=advapi /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveIMG_RamFs]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDRAMSIZE=100M

[LiveIMG_RamFs_Debug]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG DBGCHANNEL=advapi /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDRAMSIZE=100M

[LiveIMG_Macpi]
BootType=Windows2003
SystemPath=\\reactos
Options=/HAL=halmacpi.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveIMG_Aacpi]
BootType=Windows2003
SystemPath=\\reactos
Options=/HAL=halaacpi.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveIMG_VBoxDebug]
BootType=Windows2003
SystemPath=\\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveIMG_Screen]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG DBGCHANNEL=advapi /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT /RDRAMSIZE=180M

[LiveIMG_LogFile]
BootType=Windows2003
SystemPath=\\reactos
Options=/DEBUG /DEBUGPORT=FILE:\\Device\\HarddiskX\\PartitionY\\debug.log /SOS /FASTDETECT /MININT
