[FREELOADER]
DefaultOS=LiveImg_RamDisk_SMP
TimeOut=1

[Display]
TitleText=ReactOS Boot Media
MinimalUI=Yes

[Operating Systems]
Setup="ReactOS Setup (Text Mode)"
LiveImg="ReactOS Live Environment (Graphics Mode)"
LiveImg_RamDisk="ReactOS Live Environment - RamDisk"
LiveImg_RamDisk_SMP="ReactOS Live Environment - RamDisk (Debug, SMP)"
LiveImg_RamDisk_SMP_Diag="ReactOS Live Environment - RamDisk (Debug, SMP, Verbose)"

;; The entries below are for testing and development:
Setup_Debug="Setup (Debug)"
Setup_Screen="Setup (Screen Debug)"
LiveImg_Debug="Live (Debug)"
LiveImg_VBoxDebug="Live (VBox Debug)"
LiveImg_Screen="Live (Screen Debug)"
;; The following entry is an example template:
;LiveImg_LogFile="Live (Log file)"

[Setup]
BootType=ReactOSSetup

[Setup_Debug]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[LiveImg]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT

[LiveImg_RamDisk]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH= /RDEXPORTASCD
;Options=/FASTDETECT /MININT /RDPATH=liveimg.iso /RDEXPORTASCD

[LiveImg_RamDisk_SMP]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/HAL=halmp.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH= /RDEXPORTASCD /LOADSYMBOLS

[LiveImg_RamDisk_SMP_Diag]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/HAL=halmp.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH= /RDEXPORTASCD /SMPDIAG

[LiveImg_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveImg_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveImg_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

;[LiveImg_LogFile]
;BootType=Windows2003
;SystemPath=\reactos
;Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
