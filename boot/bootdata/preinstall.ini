[FREELOADER]
DefaultOS=ReactOS_Debug
TimeOut=1

[Display]
TitleText=ReactOS_Debug
MinimalUI=Yes

[Operating Systems]
ReactOS="ReactOS"
ReactOS_Debug="ReactOS (Debug)"
ReactOS_Debug_UP="ReactOS (Debug, UP)"
ReactOS_Debug_Verbose="ReactOS (Debug, Verbose)"
ReactOS_VBoxDebug="ReactOS (VBox Debug)"
ReactOS_Screen="ReactOS (Screen)"
ReactOS_LogFile="ReactOS (Log file)"

[ReactOS]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/KERNEL=ntkrnlmp.exe /FASTDETECT

[ReactOS_Debug]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT

[ReactOS_Debug_UP]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT

[ReactOS_Debug_Verbose]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /KMTEST

[ReactOS_VBoxDebug]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT

[ReactOS_Screen]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT

[ReactOS_LogFile]
BootType=Windows2003
SystemPath=partition(2)\ReactOS
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=FILE /SOS /FASTDETECT
