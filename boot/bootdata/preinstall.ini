[FREELOADER]
DefaultOS=ReactOS_Debug_SMP_Verbose
TimeOut=1

[Display]
TitleText=ReactOS_Debug
MinimalUI=Yes

[Operating Systems]
ReactOS="ReactOS"
ReactOS_Debug="ReactOS (Debug)"
ReactOS_Debug_SMP="ReactOS (Debug, SMP)"
ReactOS_Debug_SMP_Verbose="ReactOS (Debug, SMP, Verbose)"
ReactOS_VBoxDebug="ReactOS (VBox Debug)"
ReactOS_Screen="ReactOS (Screen)"
ReactOS_LogFile="ReactOS (Log file)"

[ReactOS]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/FASTDETECT

[ReactOS_Debug]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT

[ReactOS_Debug_SMP]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/HAL=hal.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT

[ReactOS_Debug_SMP_Verbose]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/HAL=hal.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /KMTEST

[ReactOS_VBoxDebug]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT

[ReactOS_Screen]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT

[ReactOS_LogFile]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\ReactOS
Options=/DEBUG /DEBUGPORT=FILE /SOS /FASTDETECT
