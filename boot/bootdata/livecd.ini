[FREELOADER]
DefaultOS=LiveCD_Debug
TimeOut=1

[Display]
TitleText=ReactOS LiveCD
MinimalUI=Yes

[Operating Systems]
LiveCD="LiveCD"
LiveCD_Debug="LiveCD (Debug)"
LiveCD_Debug_UP="LiveCD (Debug, UP)"
LiveCD_Aacpi="LiveCD ACPI APIC (Debug)"
LiveCD_Screen="LiveCD (Screen)"
LiveCD_LogFile="LiveCD (Log file)"

[LiveCD]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntkrnlmp.exe /FASTDETECT /MININT

[LiveCD_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_Debug_UP]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntoskrnl.exe /HAL=halup.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_Aacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntkrnlmp.exe /HAL=halaacpi.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

[LiveCD_LogFile]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
