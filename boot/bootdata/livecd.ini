[FREELOADER]
DefaultOS=HttpBoot
TimeOut=2

[Display]
TitleText=ReactOS LiveCD
MinimalUI=Yes

[Operating Systems]
LiveCD="LiveCD"
LiveCD_Debug="LiveCD (Debug)"
LiveCD_RamFs_Debug="LiveCD RamFS (Debug)"
HttpBoot="HTTP Boot (Debug)"
LiveCD_Macpi="LiveCD ACPI SMP (Debug)"
LiveCD_Aacpi="LiveCD ACPI APIC (Debug)"
LiveCD_VBoxDebug="LiveCD (VBox Debug)"
LiveCD_Screen="LiveCD (Screen)"
LiveCD_LogFile="LiveCD (Log file)"

[LiveCD]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT /RDRAMSIZE=100M

[LiveCD_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG DBGCHANNEL=advapi /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_RamFs_Debug]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
; Writable overlay size is max(/RDRAMSIZE, ISO size + 64 MiB) and must fit under the loader low-memory budget.
; The loader now streams the ISO from firmware while building the overlay.
Options=/DEBUG DBGCHANNEL=advapi /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDRAMSIZE=100M

[HttpBoot]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT
HttpBootUrl=http://10.43.0.1/livecd.iso

[LiveCD_Macpi]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=halmacpi.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDRAMSIZE=100M

[LiveCD_Aacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=halaacpi.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDRAMSIZE=100M

[LiveCD_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveCD_Screen]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG DBGCHANNEL=advapi /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT /RDRAMSIZE=180M

[LiveCD_LogFile]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
